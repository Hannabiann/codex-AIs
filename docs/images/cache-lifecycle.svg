<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img"><title>Общий кэш: один построитель и смена поколения изменённого тома</title><rect width="100%" height="100%" fill="#F7F8FA"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#465D70"/></marker></defs><text x="40" y="55" font-family="Arial,DejaVu Sans,sans-serif" font-size="34" fill="#142B40" font-weight="700" text-anchor="start"><tspan x="40" dy="0">Общий кэш и поколения томов</tspan></text><text x="40" y="101" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#465D70" font-weight="400" text-anchor="start"><tspan x="40" dy="0">Ключ: путь тома, область, поколение, условие отбора</tspan></text><rect x="40" y="165" width="325" height="115" fill="#F7F8FA" stroke="#2563A6" stroke-width="2"/><text x="202.5" y="200.65" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#142B40" font-weight="400" text-anchor="middle"><tspan x="202.5" dy="0">Исполнитель A</tspan><tspan x="202.5" dy="29.900000000000002">строит отсутствующий</tspan><tspan x="202.5" dy="29.900000000000002">индекс</tspan></text><rect x="438" y="165" width="325" height="115" fill="#F7F8FA" stroke="#087F8C" stroke-width="2"/><text x="600.5" y="215.60000000000002" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#142B40" font-weight="400" text-anchor="middle"><tspan x="600.5" dy="0">Неизменяемые</tspan><tspan x="600.5" dy="29.900000000000002">OID и обратные ссылки</tspan></text><rect x="835" y="165" width="325" height="115" fill="#F7F8FA" stroke="#2563A6" stroke-width="2"/><text x="997.5" y="200.65" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#142B40" font-weight="400" text-anchor="middle"><tspan x="997.5" dy="0">Исполнитель B</tspan><tspan x="997.5" dy="29.900000000000002">ждёт и использует</tspan><tspan x="997.5" dy="29.900000000000002">результат</tspan></text><path d="M 365 222 H 438" fill="none" stroke="#465D70" stroke-width="2" marker-end="url(#arrow)"/><path d="M 763 222 H 835" fill="none" stroke="#465D70" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="365" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" fill="#2563A6" font-weight="700" text-anchor="start"><tspan x="40" dy="0">Неизменённый архив</tspan></text><text x="40" y="416" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" fill="#142B40" font-weight="400" text-anchor="start"><tspan x="40" dy="0">Индекс используется повторно</tspan><tspan x="40" dy="31.200000000000003">после записи другого тома.</tspan></text><text x="650" y="365" font-family="Arial,DejaVu Sans,sans-serif" font-size="27" fill="#2563A6" font-weight="700" text-anchor="start"><tspan x="650" dy="0">Изменённый рабочий том</tspan></text><text x="650" y="416" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" fill="#142B40" font-weight="400" text-anchor="start"><tspan x="650" dy="0">Новое поколение исключает</tspan><tspan x="650" dy="31.200000000000003">устаревший результат.</tspan></text><text x="40" y="545" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#465D70" font-weight="400" text-anchor="start"><tspan x="40" dy="0">I/O и сортировка вне mutex кэша. Проверка журнала выполняется до использования результата.</tspan></text></svg>