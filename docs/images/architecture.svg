<text x="752" y="506" fill="#52677c" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400">XLS-отчёты</text>
<text x="752" y="565" fill="#008779" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700">Runtime + Db4Engine</text>
<line x1="892" y1="591" x2="892" y2="615" stroke="#008779" stroke-width="3"/>
<polygon points="885,613 899,613 892,625" fill="#008779"/>
<line x1="1236" y1="334" x2="1236" y2="353" stroke="#008779" stroke-width="3"/>
