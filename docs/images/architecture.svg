<polygon points="1229,613 1243,613 1236,625" fill="#008779"/>
<rect x="48" y="626" width="1344" height="85" rx="0" fill="#f3f6fa" stroke="#d3dfe9"/>
<text x="70" y="661" fill="#132c45" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="400">Чтение: собственные кэши исполнителя, индексный отбор, открытые образы томов</text>
<text x="70" y="694" fill="#52677c" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Очередь тяжёлых запросов не занимает резервные места интерфейса и владельца.</text>
<line x1="720" y1="712" x2="720" y2="736" stroke="#008779" stroke-width="3"/>
<polygon points="713,734 727,734 720,746" fill="#008779"/>
<rect x="48" y="747" width="1344" height="151" rx="0" fill="white" stroke="#d3dfe9"/>
<text x="70" y="786" fill="#132c45" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700">Запись: согласованная публикация одного изменения</text>
<text x="70" y="824" fill="#52677c" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400">Проверка редакции → образ и индексы → журнал → резерв → страницы → фиксация</text>
<text x="70" y="862" fill="#52677c" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400">Отмена ждёт текущую публикацию. Общей транзакции каскада нет.</text>
<line x1="720" y1="899" x2="720" y2="920" stroke="#008779" stroke-width="3"/>
<polygon points="713,918 727,918 720,930" fill="#008779"/>
<rect x="48" y="931" width="1344" height="106" rx="0" fill="#f3f6fa" stroke="#d3dfe9"/>
<text x="70" y="968" fill="#132c45" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700">config.db4 → виртуальные каталоги, тома, права и порядок перекрытия</text>
<text x="70" y="1008" fill="#52677c" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400">DB4 / DBS: записи, KS и шаблоны. kodeks.spl: словарь. Настройки Rust: codex-AIs.settings.</text>
</svg>