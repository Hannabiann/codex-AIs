<text x="1096" y="438" fill="#52677c" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Удаление и просмотр</text>
<text x="1096" y="472" fill="#52677c" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Поиск</text>
<text x="1096" y="506" fill="#52677c" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400">XLS-отчёты</text>
<text x="1096" y="565" fill="#008779" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700">Runtime + Db4Engine</text>
