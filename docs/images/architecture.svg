<rect x="392" y="364" width="312" height="226" rx="0" fill="white" stroke="#d3dfe9"/>
<text x="408" y="399" fill="#132c45" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700">2 · Интерфейс</text>
<text x="408" y="438" fill="#52677c" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Главная /20a</text>
<text x="408" y="472" fill="#52677c" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400">d / hdoc / doc</text>
<text x="408" y="506" fill="#52677c" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Атрибуты / W</text>
<text x="408" y="565" fill="#008779" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="700">Runtime + Db4Engine</text>
<line x1="548" y1="591" x2="548" y2="615" stroke="#008779" stroke-width="3"/>
<polygon points="541,613 555,613 548,625" fill="#008779"/>
