<text x="64" y="438" fill="#52677c" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Word /99</text>
<text x="64" y="472" fill="#52677c" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400">At / фоновые очереди</text>
<text x="64" y="506" fill="#52677c" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Остальные KS</text>
