<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img"><title>Обработка HTTP-запросов и запись DB40</title>
<text x="48" y="54" fill="#132c45" font-family="Arial,DejaVu Sans,sans-serif" font-size="32" font-weight="700">Обработка запросов</text>
<rect x="48" y="88" width="1344" height="90" rx="0" fill="white" stroke="#d3dfe9"/>
<text x="70" y="123" fill="#132c45" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700">Браузер: /20a, /admin     Word: /99</text>
<text x="70" y="157" fill="#52677c" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="400">HTTP/1.0 и HTTP/1.1 · отдельная авторизация каждого запроса</text>
<line x1="720" y1="179" x2="720" y2="201" stroke="#008779" stroke-width="3"/>
<polygon points="713,199 727,199 720,211" fill="#008779"/>
<rect x="48" y="212" width="1344" height="100" rx="0" fill="#f3f6fa" stroke="#d3dfe9"/>
