<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img"><title>Почему нагрузка влияет на серверы по-разному</title><desc>Наблюдения профиля kodweb 5.3.2.120 и устройство Codex-AIs 0.28.2. Это не схема всех подсистем.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1360" height="900" fill="#fff" rx="0" stroke="none"/><text x="36" y="43" fill="#172033" font-size="27" text-anchor="start" font-weight="600">Почему нагрузка влияет на серверы по-разному</text><text x="36" y="74" fill="#475569" font-size="17" text-anchor="start" font-weight="400">Наблюдения профиля kodweb 5.3.2.120 и устройство Codex-AIs 0.28.2. Это не схема всех подсистем.</text><rect x="35" y="110" width="620" height="80" fill="#f8fafc" rx="8" stroke="#cbd5e1"/><rect x="35" y="110" width="5" height="80" fill="#b45309" rx="2" stroke="none"/><text x="55" y="140" fill="#b45309" font-size="20" text-anchor="start" font-weight="600">kodweb.exe · синхронные обработчики</text><text x="55" y="171" fill="#172033" font-size="17" text-anchor="start" font-weight="400">40 потоков; 20 зарезервированы для локальных запросов.</text><rect x="705" y="110" width="620" height="80" fill="#f8fafc" rx="8" stroke="#cbd5e1"/><rect x="705" y="110" width="5" height="80" fill="#0f766e" rx="2" stroke="none"/><text x="725" y="140" fill="#0f766e" font-size="20" text-anchor="start" font-weight="600">Codex-AIs · сеть и KS/DB разделены</text><text x="725" y="171" fill="#172033" font-size="17" text-anchor="start" font-weight="400">Tokio: 64 HTTP-соединения, keep-alive без исполнителя KS.</text><line x1="345" y1="190" x2="345" y2="225" stroke="#64748b" stroke-width="2"/><path d="M 340 218 L 345 225 L 350 218" fill="none" stroke="#64748b" stroke-width="2"/><line x1="1015" y1="190" x2="1015" y2="225" stroke="#64748b" stroke-width="2"/><path d="M 1010 218 L 1015 225 L 1020 218" fill="none" stroke="#64748b" stroke-width="2"/><rect x="35" y="225" width="620" height="118" fill="#f8fafc" rx="8" stroke="#cbd5e1"/><rect x="35" y="225" width="5" height="118" fill="#b45309" rx="2" stroke="none"/><text x="55" y="255" fill="#b45309" font-size="20" text-anchor="start" font-weight="600">Один обработчик сопровождает запрос</text><text x="55" y="286" fill="#172033" font-size="17" text-anchor="start" font-weight="400">HTTP → KS → SQL/DB4 → ответ.</text><text x="55" y="312" fill="#172033" font-size="17" text-anchor="start" font-weight="400">При конвертации он ожидает kdb и Excel;</text><text x="55" y="338" fill="#172033" font-size="17" text-anchor="start" font-weight="400">keep-alive также удерживает поток соединения.</text><rect x="705" y="225" width="620" height="118" fill="#f8fafc" rx="8" stroke="#cbd5e1"/><rect x="705" y="225" width="5" height="118" fill="#0f766e" rx="2" stroke="none"/><text x="725" y="255" fill="#0f766e" font-size="20" text-anchor="start" font-weight="600">Шесть исполнителей KS/DB</text><text x="725" y="286" fill="#172033" font-size="17" text-anchor="start" font-weight="400">1 — Word, состояние каталогов, At; 1 — интерфейс.</text><text x="725" y="312" fill="#172033" font-size="17" text-anchor="start" font-weight="400">1 — очередь поиска; 3 — отчёты и удаления.</text><text x="725" y="338" fill="#172033" font-size="17" text-anchor="start" font-weight="400">Свободные тяжёлые помогают занятому поиску и интерфейсу.</text><line x1="345" y1="343" x2="345" y2="378" stroke="#64748b" stroke-width="2"/><path d="M 340 371 L 345 378 L 350 371" fill="none" stroke="#64748b" stroke-width="2"/><line x1="1015" y1="343" x2="1015" y2="378" stroke="#64748b" stroke-width="2"/><path d="M 1010 371 L 1015 378 L 1020 371" fill="none" stroke="#64748b" stroke-width="2"/><rect x="35" y="378" width="620" height="145" fill="#f8fafc" rx="8" stroke="#cbd5e1"/><rect x="35" y="378" width="5" height="145" fill="#b45309" rx="2" stroke="none"/><text x="55" y="408" fill="#b45309" font-size="20" text-anchor="start" font-weight="600">Чтение данных и синхронизация</text><text x="55" y="439" fill="#172033" font-size="17" text-anchor="start" font-weight="400">Повторная проверка 10-байтового дескриптора MainKey.</text><text x="55" y="465" fill="#172033" font-size="17" text-anchor="start" font-weight="400">Общие контексты томов защищены блокировками.</text><text x="55" y="491" fill="#172033" font-size="17" text-anchor="start" font-weight="400">Чередующиеся обходы вытесняют общий буфер 4 КиБ*;</text><text x="55" y="517" fill="#172033" font-size="17" text-anchor="start" font-weight="400">SQL и интерпретатор добавляют вычислительную работу.</text><rect x="705" y="378" width="620" height="145" fill="#f8fafc" rx="8" stroke="#cbd5e1"/><rect x="705" y="378" width="5" height="145" fill="#0f766e" rx="2" stroke="none"/><text x="725" y="408" fill="#0f766e" font-size="20" text-anchor="start" font-weight="600">Снимки и повторное использование данных</text><text x="725" y="439" fill="#172033" font-size="17" text-anchor="start" font-weight="400">Поиск: короткие атрибуты; ссылки: кэш 64 × 64 КиБ.</text><text x="725" y="465" fill="#172033" font-size="17" text-anchor="start" font-weight="400">Общие кэши; отдельное состояние чтения у исполнителей.</text><text x="725" y="491" fill="#172033" font-size="17" text-anchor="start" font-weight="400">MainKey: снимки и пакетная проверка актуального тома.</text><text x="725" y="517" fill="#172033" font-size="17" text-anchor="start" font-weight="400">Запись согласуется; журнал сохраняет восстановление.</text><line x1="345" y1="523" x2="345" y2="558" stroke="#64748b" stroke-width="2"/><path d="M 340 551 L 345 558 L 350 551" fill="none" stroke="#64748b" stroke-width="2"/><line x1="1015" y1="523" x2="1015" y2="558" stroke="#64748b" stroke-width="2"/><path d="M 1010 551 L 1015 558 L 1020 551" fill="none" stroke="#64748b" stroke-width="2"/><rect x="35" y="558" width="620" height="118" fill="#f8fafc" rx="8" stroke="#cbd5e1"/><rect x="35" y="558" width="5" height="118" fill="#b45309" rx="2" stroke="none"/><text x="55" y="588" fill="#b45309" font-size="20" text-anchor="start" font-weight="600">Отчёт Excel</text><text x="55" y="619" fill="#172033" font-size="17" text-anchor="start" font-weight="400">KS формирует данные → kdb → MSXML / COM → Excel.</text><text x="55" y="645" fill="#172033" font-size="17" text-anchor="start" font-weight="400">Есть заполнение шаблона, поиск ячеек и пересчёт.</text><text x="55" y="671" fill="#172033" font-size="17" text-anchor="start" font-weight="400">Потоки и процессы могут работать, пока пользователь ждёт.</text><rect x="705" y="558" width="620" height="118" fill="#f8fafc" rx="8" stroke="#cbd5e1"/><rect x="705" y="558" width="5" height="118" fill="#0f766e" rx="2" stroke="none"/><text x="725" y="588" fill="#0f766e" font-size="20" text-anchor="start" font-weight="600">Прямая запись XLS</text><text x="725" y="619" fill="#172033" font-size="17" text-anchor="start" font-weight="400">KS формирует данные → модуль записи XLS (BIFF8).</text><text x="725" y="645" fill="#172033" font-size="17" text-anchor="start" font-weight="400">Формулы сохранены; пересчёт выполняет Excel клиента.</text><text x="725" y="671" fill="#172033" font-size="17" text-anchor="start" font-weight="400">Серверу не требуется запускать Excel или MSXML.</text><rect x="35" y="712" width="1290" height="113" fill="#f8fafc" rx="8" stroke="#cbd5e1"/><rect x="35" y="712" width="5" height="113" fill="#475569" rx="2" stroke="none"/><text x="55" y="742" fill="#475569" font-size="20" text-anchor="start" font-weight="600">Ограничения, которые показал опыт</text><text x="55" y="773" fill="#172033" font-size="17" text-anchor="start" font-weight="400">kodweb не завис полностью: длинные удаления сопровождались замедлением интерфейса.</text><text x="55" y="799" fill="#172033" font-size="17" text-anchor="start" font-weight="400">Codex-AIs: один исполнитель поиска и три для отчётов/удалений; общие блокировки записи сохраняются.</text><text x="36" y="865" fill="#475569" font-size="16" text-anchor="start" font-weight="400">* Конкуренция за буфер 4 КиБ подтверждена отдельным исследованием 0.18; текущий опыт не повторяет тот контроль.</text></g></svg>