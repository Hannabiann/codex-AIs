<dialog id="picker">
  <form method="dialog">
    <label>Выбор из справочника <input type="search" id="filter" placeholder="Поиск по названию"></label>
    <p id="loading" role="status"></p>
    <select id="choices" multiple size="16" aria-label="Значения справочника" style="width:100%"></select>
    <p><button value="apply" id="apply">Применить</button><button value="cancel">Закрыть</button></p>
  </form>
</dialog>
<script>
(() => {
  const dialog = document.getElementById('picker');
  const filter = document.getElementById('filter');
  const choices = document.getElementById('choices');
  const loading = document.getElementById('loading');
  const apply = document.getElementById('apply');
  let field, selected, entries, pending;
  function showMatches() {
    const text = filter.value.trim().toLocaleLowerCase('ru');
    choices.replaceChildren();
    for (const [id, name] of entries) {
      if (name.toLocaleLowerCase('ru').includes(text) || id.includes(text)) {
        choices.add(new Option(name, id, false, selected.has(id)));
      }
    }
  }
  choices.onchange = () => {
    for (const option of choices.options) {
      if (option.selected) selected.add(option.value);
      else selected.delete(option.value);
    }
  };
  filter.oninput = showMatches;
  dialog.onclose = () => {
    pending?.abort();
    if (dialog.returnValue === 'apply' && !apply.disabled) field.value = [...selected].join(';');
  };
  document.addEventListener('click', async event => {
    const button = event.target.closest('button[data-catalog]');
    if (!button) return;
    field = button.form.elements.namedItem('value');
    selected = new Set(field.value.split(';').filter(Boolean));
    entries = [];
    filter.value = '';
    choices.replaceChildren();
    apply.disabled = true;
    loading.textContent = 'Загрузка…';
    dialog.returnValue = '';
    dialog.showModal();
    const controller = new AbortController();
    pending = controller;
    try {
      const url = new URL(location.href);
      url.search += '&catalog=' + encodeURIComponent(button.dataset.catalog);
      const response = await fetch(url, {signal: controller.signal});
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const html = new TextDecoder('windows-1251').decode(await response.arrayBuffer());
      const list = new DOMParser().parseFromString(html, 'text/html').querySelector('select[multiple]');
      if (!list) throw new Error('Справочник недоступен');
      entries = [...list.options].map(option => [option.value, option.text]);
      showMatches();
      loading.textContent = 'Записей: ' + entries.length;
      apply.disabled = false;
    } catch (err) {
      if (!controller.signal.aborted) loading.textContent = err.message;
    }
  });
})();
</script>
