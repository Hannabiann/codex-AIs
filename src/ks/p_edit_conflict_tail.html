<noscript>Сравнение и сохранение работают без JavaScript. Чтобы сохранить черновик отдельно, скопируйте значения из полей.</noscript>
</main><script>
document.getElementById('download').addEventListener('click',function(){
 const root=document.getElementById('comparison');const fields={};
 root.querySelectorAll('[data-draft]').forEach(function(e){fields[e.name]={value:e.value,absent:!!root.querySelector('[name="codex_absent_'+e.name+'"]:checked')};});
 const data=JSON.stringify({object:root.dataset.oid,fields:fields},null,2);
 const url=URL.createObjectURL(new Blob([data],{type:'application/json;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='P-draft-'+root.dataset.oid+'.json';a.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);
});
</script></body></html>
